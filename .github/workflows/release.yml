name: Release

# Pushing a v* tag is the whole release process: this builds the exe and attaches it
# to a GitHub Release, so a published binary always comes from a known commit rather
# than from whatever happened to be in someone's bin folder.
on:
  push:
    tags:
      - 'v*'
  # Manual runs have no tag in the ref, so the tag to release has to be named explicitly.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build BattTray.slnx --configuration Release

      # Between the build and the publish on purpose. A tag is the one push nobody gets to
      # re-do quietly, so the tests run before an exe exists to attach rather than after.
      - name: Test
        run: dotnet test tests/BattTray.Tests/BattTray.Tests.csproj --configuration Release --no-build

      - name: Publish single-file exe
        run: dotnet publish BattTray/BattTray.csproj -p:PublishProfile=win-x64

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: BattTray/bin/publish/win-x64/BattTray.exe
